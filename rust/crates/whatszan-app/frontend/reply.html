<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Balas pesan</title>
  <style>
    :root {
      --bg: #f8f5f3;
      --panel: #ffffff;
      --text: #111b21;
      --muted: #667781;
      --border: #e9edef;
      --field: #ffffff;
      --accent: #00a884;
      --accent-hover: #017f62;
      --accent-soft: rgba(0, 168, 132, 0.10);
      --shadow: 0 8px 24px rgba(17, 27, 33, 0.08);
    }

    html.dark {
      --bg: #161717;
      --panel: #1c1f1f;
      --text: #e9edef;
      --muted: #8696a0;
      --border: #2c2f30;
      --field: #242627;
      --accent: #00a884;
      --accent-hover: #00c49a;
      --accent-soft: rgba(0, 168, 132, 0.16);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      padding: 14px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 14px;
      line-height: 1.4;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex-shrink: 0;
    }

    .badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .badge svg { width: 16px; height: 16px; display: block; }

    .sender {
      min-width: 0;
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview {
      flex-shrink: 0;
      max-height: 2.8em;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    textarea {
      flex: 1 1 auto;
      min-height: 64px;
      width: 100%;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: var(--field);
      color: var(--text);
      padding: 9px 11px;
      font: inherit;
      font-size: 14px;
      line-height: 1.4;
      user-select: text;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    textarea::placeholder { color: var(--muted); }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      font: inherit;
      font-size: 13.5px;
      cursor: pointer;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .link {
      background: transparent;
      color: var(--accent);
      padding: 8px 6px;
    }

    .link:hover { background: var(--accent-soft); }

    .primary {
      min-width: 84px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }

    .primary:hover:not(:disabled) { background: var(--accent-hover); }

    .primary:disabled {
      opacity: 0.45;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
    </span>
    <span class="sender" id="sender"></span>
  </div>

  <div class="preview" id="preview"></div>

  <textarea id="text" rows="3" placeholder="Balas pesan..." autofocus></textarea>

  <div class="footer">
    <button class="link" id="open" type="button">Buka chat</button>
    <button class="primary" id="send" type="button" disabled>Kirim</button>
  </div>

  <script>
    (function () {
      const invoke = window.__TAURI__ && window.__TAURI__.core
        ? window.__TAURI__.core.invoke
        : null;
      const sender = document.getElementById('sender');
      const preview = document.getElementById('preview');
      const text = document.getElementById('text');
      const send = document.getElementById('send');
      const open = document.getElementById('open');

      let busy = false;
      let closing = false;

      function updateSend() {
        send.disabled = busy || text.value.trim().length === 0;
      }

      function focusText() {
        try {
          text.focus();
          const end = text.value.length;
          text.setSelectionRange(end, end);
        } catch (_) {}
      }

      function render(context) {
        if (!context) return;
        busy = false;
        closing = false;
        text.value = '';
        sender.textContent = context.title || '';
        sender.title = context.title || '';
        preview.textContent = context.body || '';
        preview.hidden = !context.body;
        text.placeholder = context.placeholder || '';
        send.textContent = context.send_label || 'Kirim';
        open.textContent = context.open_label || 'Buka chat';
        document.title = context.send_label
          ? `${context.send_label} — ${context.title || 'WhatsZan'}`
          : 'Balas pesan';
        updateSend();
        requestAnimationFrame(focusText);
      }

      async function submit() {
        if (busy) return;
        const value = text.value.trim();
        if (!value) return;
        busy = true;
        updateSend();
        try {
          await invoke('notification_reply_submit', { text: value });
        } catch (err) {
          busy = false;
          updateSend();
          console.error(err);
        }
      }

      async function openChat() {
        if (closing) return;
        closing = true;
        try {
          await invoke('notification_reply_open_chat');
        } catch (err) {
          closing = false;
          console.error(err);
        }
      }

      async function cancel() {
        if (closing) return;
        closing = true;
        try {
          await invoke('notification_reply_cancel');
        } catch (err) {
          closing = false;
          console.error(err);
        }
      }

      text.addEventListener('input', updateSend);
      text.addEventListener('keydown', (event) => {
        if (event.isComposing) return;
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          submit();
        } else if (event.key === 'Escape') {
          event.preventDefault();
          cancel();
        }
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          event.preventDefault();
          cancel();
        }
      });
      send.addEventListener('click', submit);
      open.addEventListener('click', openChat);
      window.addEventListener('focus', focusText);

      window.__wzReplyContext = render;

      if (!invoke) {
        sender.textContent = 'Tauri IPC tidak tersedia';
        return;
      }

      invoke('notification_reply_context')
        .then((context) => {
          if (context) render(context);
        })
        .catch((err) => console.error(err));
    })();
  </script>
</body>
</html>
